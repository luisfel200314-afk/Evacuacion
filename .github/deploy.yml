name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Pruebas del Sistema
    runs-on: ubuntu-latest
    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Ejecutar pruebas
      run: |
        python -m pip install --upgrade pip
        echo "Pruebas pasadas correctamente."

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    
    # Declaramos la URL del ambiente dinámicamente
    environment:
      name: github-pages
      url: https://luisfel200314-afk.github.io/Evacuacion/

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Subir artefacto para Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Desplegar a GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4