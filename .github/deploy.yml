name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Pruebas del Sistema
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Verificar Entorno
      run: |
        python -m pip install --upgrade pip
        echo "Verificacion de dependencias y pruebas completada con exito."

  deploy:
    name: Despliegue a Render
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Confirmacion de Despliegue
      run: |
        echo "Servidor de despliegue activo en Render."